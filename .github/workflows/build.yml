name: Build RJ_AC Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Extract source ZIP
        run: unzip "RJ AC.zip" -d plugin_src

      - name: Build with Maven
        working-directory: plugin_src
        run: mvn clean package -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJ_AC-1.21.11
          path: plugin_src/target/RJ_AC-*.jar
          retention-days: 7
