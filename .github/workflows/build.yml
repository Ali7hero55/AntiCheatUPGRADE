name: Build RJ_AC Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: cd plugin_src && mvn clean package -B
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RJ_AC-Plugin
          path: plugin_src/target/RJ_AC-1.0.0.jar
