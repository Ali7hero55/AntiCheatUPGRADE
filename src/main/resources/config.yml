# RJ_AC Configuration
# Author: RJ_79
# Prefix supports & color codes

prefix: "&4RJ&7_&bAnti&1CHEAT"

# General settings
general:
  alert-cooldown: 3000       # ms between repeated staff alerts for same player+check
  max-violations: 100        # violations before auto-kick even without autoban
  log-to-file: true
  debug: false

# Punishment defaults
punishments:
  default-ban-duration: "7d"
  default-mute-duration: "1h"
  ban-message: "&cYou have been banned from this server.\n&7Reason: &f{reason}\n&7Duration: &f{duration}"
  kick-message: "&cYou were kicked by RJ_AC.\n&7Reason: &f{reason}"
  mute-message: "&cYou are muted. Reason: &f{reason}"

# ─── COMBAT CHECKS ───────────────────────────────────────────────
checks:
  killaura:
    enabled: true
    max-violations: 10
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  reach:
    enabled: true
    max-reach: 3.2          # blocks; vanilla is ~3.0
    max-violations: 8
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  velocity:
    enabled: true
    min-knockback: 0.35     # fraction of expected knockback
    max-violations: 10
    auto-ban: true
    ban-duration: "3d"
    warn-staff: true

  autoclicker:
    enabled: true
    max-cps: 20
    max-violations: 15
    auto-ban: true
    ban-duration: "3d"
    warn-staff: true

  aimbot:
    enabled: true
    max-violations: 10
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  critspam:
    enabled: true
    max-violations: 10
    auto-ban: true
    ban-duration: "3d"
    warn-staff: true

  noswing:
    enabled: true
    max-violations: 10
    auto-ban: true
    ban-duration: "3d"
    warn-staff: true

  backtrack:
    enabled: true
    max-violations: 8
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  multiaura:
    enabled: true
    max-violations: 6
    auto-ban: true
    ban-duration: "14d"
    warn-staff: true

  hitbox:
    enabled: true
    max-violations: 10
    auto-ban: true
    ban-duration: "3d"
    warn-staff: true

# ─── CRYSTAL PVP CHECKS ──────────────────────────────────────────
  crystalaura:
    enabled: true
    max-violations: 8
    auto-ban: true
    ban-duration: "14d"
    warn-staff: true

  autocrystal:
    enabled: true
    min-place-explode-ms: 50   # suspicious if place→explode < 50 ms
    max-violations: 8
    auto-ban: true
    ban-duration: "14d"
    warn-staff: true

  fastcrystalplace:
    enabled: true
    max-place-per-second: 10
    max-violations: 10
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  selfcrystal:
    enabled: true
    max-violations: 8
    auto-ban: true
    ban-duration: "7d"
    warn-staff: true

  # AutoTotem — fast re-equip = instant flag + autoban
  autototem:
    enabled: true
    reequip-threshold-ms: 100  # re-equip faster than this = instant ban
    max-violations: 3
    auto-ban: true
    ban-duration: "permanent"
    warn-staff: true

